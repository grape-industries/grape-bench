# Builds the report from results/*.json and publishes it to GitHub Pages.
name: report
on:
  push:
    branches: [main]
    paths: ["results/**", "report.py", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python report.py
        env:
          # Top-bar links; set these as repository variables to change them.
          BENCH_GRAPE_URL: ${{ vars.BENCH_GRAPE_URL || 'GRAPE_URL' }}
          BENCH_SOURCE_URL: ${{ vars.BENCH_SOURCE_URL || 'https://github.com/grape-industries/grape-bench' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
